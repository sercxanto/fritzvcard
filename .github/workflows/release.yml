name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ github.ref_name }}
    steps:
      - name: Validate stable release tag
        shell: bash
        run: |
          if ! [[ "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo 'Expected a stable release tag of the form vX.Y.Z.' >&2
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: '1.27'
      - uses: go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e # v2.2.0
        with:
          version: 3.54.0
      - run: task lint
      - run: task test
      - run: task build:all "VERSION=$VERSION"
      - name: Publish release binaries
        run: |
          gh release create "$VERSION" --verify-tag --generate-notes \
            dist/fritzvcard-linux-amd64 dist/fritzvcard-linux-arm64 \
            dist/fritzvcard-darwin-amd64 dist/fritzvcard-darwin-arm64 \
            dist/fritzvcard-windows-amd64.exe
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
