name: Test WinGet manifest for v0.1.0

on:
  push:
    branches: [winget-catalog-validation]

permissions:
  contents: read

jobs:
  validate-and-install:
    runs-on: windows-latest
    timeout-minutes: 10
    env:
      TAG: v0.1.0
      WINGET_VERSION: 1.29.380
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Prepare the released manifest
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          $root = Join-Path $env:RUNNER_TEMP 'fritzvcard-winget'
          New-Item -ItemType Directory -Path $root | Out-Null
          $sums = Join-Path $root 'SHA256SUMS'
          Invoke-WebRequest "https://github.com/sercxanto/fritzvcard/releases/download/$env:TAG/SHA256SUMS" -OutFile $sums
          python -B .github/scripts/package_metadata.py $env:TAG $sums $root
          $manifest = Join-Path $root "manifests/s/Sercxanto/Fritzvcard/$($env:TAG.Substring(1))"
          "FRITZVCARD_MANIFEST=$manifest" >> $env:GITHUB_ENV
      - name: Update WinGet to the release that supports the catalog schema
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $false
          if ((winget --version) -ne "v$env:WINGET_VERSION") {
            winget upgrade --id Microsoft.AppInstaller --exact --version $env:WINGET_VERSION --source winget --silent --disable-interactivity --accept-package-agreements --accept-source-agreements
            # WinGet can abort its own process when the update requires a restart.
            if ($LASTEXITCODE -notin @(0, -2147467260)) {
              throw "WinGet upgrade exited with $LASTEXITCODE"
            }
          }
          exit 0
      - name: Validate and install with WinGet
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          $version = winget --version
          Write-Host "WinGet $version"
          if ($version -ne "v$env:WINGET_VERSION") {
            throw "Expected WinGet v$env:WINGET_VERSION"
          }
          winget validate --manifest $env:FRITZVCARD_MANIFEST
          winget settings --enable LocalManifestFiles
          winget install --manifest $env:FRITZVCARD_MANIFEST --scope user --silent --disable-interactivity --accept-package-agreements --accept-source-agreements
      - name: Check the installed command and version
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          $env:Path += ';' + [Environment]::GetEnvironmentVariable('Path', 'User')
          $command = Get-Command fritzvcard -CommandType Application
          $version = (& $command version | Out-String).Trim()
          Write-Host "$($command.Path): $version"
          if ($version -cne "fritzvcard $env:TAG") {
            throw "Expected fritzvcard $env:TAG, got '$version'"
          }
