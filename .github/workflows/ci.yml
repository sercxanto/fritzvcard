name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: '1.27'
      - uses: go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e # v2.2.0
        with:
          version: 3.54.0
      - run: task lint
      - run: CGO_ENABLED=0 go test -coverpkg=./... -coverprofile=coverage.out ./...
      - run: task build:all VERSION=ci
      - name: Check Codecov upload eligibility
        id: coverage-upload
        if: github.event_name == 'push'
        shell: bash
        env:
          PUSH_REF: ${{ github.event.ref }}
          PUSH_DELETED: ${{ github.event.deleted }}
        run: |
          # Actions expressions compare strings case-insensitively.
          if [[ "$PUSH_REF" == refs/heads/main && "$PUSH_DELETED" == false ]]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Upload coverage to Codecov
        if: steps.coverage-upload.outputs.enabled == 'true'
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        continue-on-error: true
        with:
          files: ./coverage.out
          disable_search: true
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

  windows-export:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: '1.27'
      - run: go test ./internal/cli -run 'TestExport|TestWriteExportFile'
