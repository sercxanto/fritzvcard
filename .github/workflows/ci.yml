name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27'
      - uses: go-task/setup-task@v2
        with:
          version: 3.54.0
      - run: task lint
      - run: task test
      - run: task build:all VERSION=ci

  windows-export:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27'
      - run: go test ./internal/cli -run 'TestExport|TestWriteExportFile'
